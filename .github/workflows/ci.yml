name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Zig 0.17.1 / Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Toolchain
        run: zig version
      - name: Zig tests (Debug)
        run: zig build test
      - name: Zig tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe
      - name: Numerical accuracy and math API inventory
        run: |
          zig build math-accuracy -Doptimize=ReleaseSafe
          zig build math-audit
      - name: Python reference dependencies
        run: python -m pip install 'mpmath==1.3.0'
      - name: Python tests and golden vectors
        run: |
          python -m unittest discover -s tests -v
          python tools/generate_math_vectors.py --check
          python tools/generate_math_stress.py --check
      - name: Benchmark smoke (not a performance gate)
        run: zig build math-bench -Doptimize=ReleaseFast -- --size 8192 --warmup 1 --iterations 3
      - name: Repository hygiene
        run: python tools/repo_audit.py --strict
